[project]
name = "obsidian-mcp"
version = "0.1.0"
description = "My first commit to my first obsidian MCP"
readme = "README.md"
authors = [
    { name = "Omgitskillah", email = "clarence.alucho@gmail.com" }
]
requires-python = ">=3.14.7"
dependencies = [
    "mcp>=2.2.0",
    "python-dotenv>=1.2.3",
    "access-logging",
    "python-ulid>=4.0.1",
    "pyyaml>=6.0.3",
    "unidecode>=1.4.0",
    "sqlite-vec>=0.1.9",
    "markdown-it-py>=4.0,<5",
]

[project.scripts]
obsidian-mcp = "obsidian_mcp:main"
obsidian-mcp-index = "obsidian_mcp.semantic:main"
obsidian-mcp-links = "obsidian_mcp.link_integrity:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
access-logging = { path = "vendor/access-logging" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
