name: Tests

on:
  # Once per change: a pull request's branch, then main when it merges. Runs cost minutes.
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        env:
          VAULT_PATH: ${{ runner.temp }}/ci-vault
        run: uv run --locked pytest -v tests vendor/access-logging/tests --cov=obsidian_mcp --cov=access_logging --cov-report=term-missing
      - name: Coverage summary
        if: always()
        run: uv run --locked coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
