name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
      - name: Prepare standalone test workspace
        run: python3 ci/prepare-workspace.py "$RUNNER_TEMP/obsidian-ci"
      - name: Install dependencies
        run: uv sync --locked --project "$RUNNER_TEMP/obsidian-ci"
      - name: Run tests
        working-directory: ${{ runner.temp }}/obsidian-ci
        env:
          VAULT_PATH: /tmp/ci-vault
        run: uv run --locked pytest -v servers/obsidian/tests tools/logging/tests --cov=obsidian_mcp --cov=access_logging --cov-report=term-missing
      - name: Coverage summary
        if: always()
        working-directory: ${{ runner.temp }}/obsidian-ci
        run: uv run --locked coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
